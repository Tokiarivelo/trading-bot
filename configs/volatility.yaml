# VOLATILITY-REGIME CONFIG.
# Classifies the current market into LOW/NORMAL/HIGH/EXTREME by
# percentile-ranking the latest ATR reading against its own trailing
# history. Phase A (this file's consumer today) only builds the classifier;
# later phases read the sl/tp-multiplier and position-management fields
# below to adapt scalp bots' SL/TP distance and exits during volatile
# markets. Like risk.yaml, this is trading-behavior config, not a secret —
# safe to hand-edit, but generated/AI refinement code must not modify it
# outside its documented workflow.

# Lookback period (in bars) for the ATR itself — same meaning as any other
# ATR period, e.g. Wilder's default of 14.
atr_period: 14

# How many trailing ATR readings to rank the current ATR against when
# computing its percentile. Larger = smoother/slower regime changes,
# smaller = more reactive to recent volatility shifts.
regime_lookback_bars: 100

# Percentile-rank thresholds (0-100) that bucket the current ATR reading
# into a regime: below low_percentile = LOW, between low_percentile and
# high_percentile = NORMAL, between high_percentile and extreme_percentile
# = HIGH, above extreme_percentile = EXTREME.
#
# high_percentile and extreme_percentile were tuned in Phase D (2026-08)
# via a ~90-candidate grid/random search against 6 active XAUUSD bots.
# Phase C found the Phase A defaults (70/90) clearly helped the two M1
# SND-structure bots but hurt the four M5 bots (entry blocks firing too
# often against already high-PF strategies). The search's counterintuitive
# finding: LOWERING high_percentile to 60 (so HIGH-regime SL/TP widening
# kicks in *more* often, not less) improved every bot, because under
# fixed %-risk position sizing a wider stop mostly means fewer premature
# stopouts, not more $ risk. Raising extreme_percentile to 98 (fewer,
# genuinely-rare EXTREME entry-blocks) helped independently. Net effect
# vs the Phase A defaults, measured as profit_factor relative to a
# no-guard baseline across all 6 bots: mean relative_pf 1.01 -> 1.17,
# worst-case (min) relative_pf 0.85 -> 0.92 — i.e. this config no longer
# makes any tested bot meaningfully worse than having no guard at all,
# and it further improves the M1 win Phase A already had. Full search
# trail: see PHASE_D scratch notes referenced in the Phase D report.
low_percentile: 20
high_percentile: 60
extreme_percentile: 98

# SL distance multiplier applied to the strategy's base stop-loss distance,
# per regime. EXTREME has no multiplier here — Phase B blocks new entries
# outright in EXTREME rather than scaling into them.
#
# sl/tp_multiplier_high raised from 1.3 (Phase A) to 1.45 in Phase D —
# same search as above found more aggressive HIGH-regime widening
# (paired with the lower high_percentile) kept improving every bot within
# the swept range (1.0-1.45); 1.45 was the top of the range tested, not
# necessarily a hard ceiling, but the search wasn't pushed further to
# keep Phase D's runtime bounded. sl/tp_multiplier_low left at Phase A's
# 0.85 — deprioritized in the Phase D search, no evidence it needed
# retuning.
sl_multiplier_low: 0.85
sl_multiplier_normal: 1.0
sl_multiplier_high: 1.45

# Same idea as the sl_multiplier_* fields above, but for take-profit
# distance.
tp_multiplier_low: 0.85
tp_multiplier_normal: 1.0
tp_multiplier_high: 1.45

# When the market flips to EXTREME while a position is open and losing,
# close it immediately instead of waiting for SL — used by Phase B's
# position-manager rule.
extreme_close_if_losing: true

# When the market flips to EXTREME while a position is open and winning,
# lock in profit by moving the stop to this fraction of the position's
# R-multiple (e.g. 0.5 = lock in half of the current unrealized R).
extreme_profit_lock_r_mult: 0.5

# Chandelier-exit trailing stop: trails the stop `chandelier_atr_mult` ATRs
# behind the extreme favorable price reached since entry, once the position
# has reached at least `chandelier_min_profit_r` R of unrealized profit.
chandelier_atr_mult: 2.0
chandelier_min_profit_r: 1.0
